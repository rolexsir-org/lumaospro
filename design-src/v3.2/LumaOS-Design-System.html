const VIEWS = {
  prototype:{label:'Prototype', title:'Interactive prototype', sub:'Live, editable screens. Switch theme, icon treatment and grid on the right — the device re-renders from tokens, exactly as the launcher would.', build:protoView,
    icon:'gesture', grp:'Design'},
  screens:{label:'Screens', title:'Screen inventory', sub:'', build:screensView, icon:'apps', grp:'Design'},
  themes:{label:'Themes', title:'', sub:'', build:themesView, icon:'palette', grp:'Design'},
  compare:{label:'Compare', title:'', sub:'', build:compareView, icon:'layers', grp:'Design'},
  widgets:{label:'Widgets', title:'', sub:'', build:widgetsView, icon:'widget', grp:'Design'},
  system:{label:'Foundations', title:'', sub:'', build:systemView, icon:'type', grp:'System'},
  motion:{label:'Motion', title:'', sub:'', build:motionView, icon:'bolt', grp:'System'},
  states:{label:'States', title:'', sub:'', build:statesView, icon:'layers', grp:'System'},
  handoff:{label:'Handoff', title:'', sub:'', build:handoffView, icon:'database', grp:'System'},
};
let currentView = 'prototype';

function renderNav(){
  const groups = {};
  Object.entries(VIEWS).forEach(([k,v])=>{ (groups[v.grp] = groups[v.grp]||[]).push([k,v]); });
  return Object.entries(groups).map(([g,items])=>`
    <div class="rail__group">
      <div class="rail__label">${g}</div>
      ${items.map(([k,v])=>`<button class="rail__item" data-view="${k}" aria-current="${currentView===k}">
        ${glyph(v.icon,14,{sw:1.7})}<span>${v.label}</span></button>`).join('')}
    </div>`).join('') +
    `<div class="rail__note">Three themes · ${SCREENS.length} screens · 8 widget families.<br>All frames are live components rendered from one token layer.</div>`;
}

function renderStage(){
  const v = VIEWS[currentView];
  const host = document.getElementById('stage');
  if (currentView === 'prototype'){
    host.innerHTML = `<div class="view" data-active="true">${protoView()}</div>`;
  } else {
    host.innerHTML = `<div class="view" data-active="true">${v.build()}</div>`;
  }
  updateDevice();
  bindStageEvents();
}

function updateDevice(){
  const host = document.getElementById('deviceHost');
  if (!host) return;
  const z = state.zoom;
  host.style.height = (844 * z) + 'px';
  host.innerHTML = `<div style="transform:scale(${z});transform-origin:top center">${deviceHTML({screen:state.screen})}</div>`;
  const label = document.getElementById('zoomLabel');
  if (label) label.textContent = Math.round(z*100) + '%';
  const now = document.querySelector('.stagebar__now');
  if (now) now.textContent = screenMeta(state.screen).name;
  document.querySelectorAll('.screenList button').forEach(b=>{
    b.setAttribute('aria-current', String(b.dataset.screen === state.screen));
  });
  host.style.setProperty('--dev-h', (844*z)+'px');
}

/* ---------- events ---------- */
function setScreen(id){ state.screen = id; state.journey = -1; renderStage(); }
function setTheme(t){
  state.theme = t;
  state.treat = DEFAULTS[t].treat;
  state.tile = DEFAULTS[t].tile;
  document.documentElement.style.setProperty('--ui-accent', THEMES[t].accent);
  document.querySelectorAll('[data-set-theme]').forEach(b=>{
    if (b.closest('.themeDots') || b.closest('.miniSeg') || b.classList.contains('themeTile')) return;
    b.setAttribute('aria-pressed', String(b.dataset.setTheme===t));
  });
  document.querySelectorAll('.themeDot').forEach(d=>d.setAttribute('aria-pressed', String(d.dataset.setTheme===t)));
  document.querySelectorAll('.miniSeg [data-set-theme]').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.setTheme===t)));
  renderStage();
}
function applyThemeFlow(){
  const prev = state.theme;
  state.screen = 'applyState'; renderStage();
  setTimeout(()=>{
    state.screen = 'appliedState'; renderStage();
    const t = document.getElementById('deviceHost');
    if (t){
      const toast = t.querySelector('.toast__undo');
      if (toast) toast.onclick = () => { state.theme = prev; document.documentElement.style.setProperty('--ui-accent', THEMES[prev].accent); state.screen='home'; renderStage(); };
    }
  }, 1400);
}
function bindStageEvents(){
  const stage = document.getElementById('stage');
  stage.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{currentView=b.dataset.view;renderNav();renderStage();document.querySelectorAll('.rail__item').forEach(x=>x.setAttribute('aria-current',String(x.dataset.view===currentView)));});
  stage.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{ setScreen(b.dataset.goto); });
  stage.querySelectorAll('[data-set-theme]').forEach(b=>b.onclick=()=>{ setTheme(b.dataset.setTheme); });
  stage.querySelectorAll('[data-set-treat]').forEach(b=>b.onclick=()=>{
    state.treat=b.dataset.setTreat;
    stage.querySelectorAll('[data-set-treat]').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.setTreat===state.treat)));
    updateDevice();
  });
  stage.querySelectorAll('[data-board-theme]').forEach(b=>b.onclick=()=>{ state.boardTheme=b.dataset.boardTheme; renderStage(); });
  stage.querySelectorAll('[data-space]').forEach(b=>b.onclick=()=>{
    state.space=b.dataset.space;
    if (b.classList.contains('spaceCard')){ state.screen = state.space==='personal' ? 'home' : 'space-'+state.space; renderStage(); }
    else renderStage();
  });
  stage.querySelectorAll('[data-studio-tab]').forEach(b=>b.onclick=()=>{ state.studioTab=b.dataset.studioTab; state.screen='studio'; renderStage(); });
  stage.querySelectorAll('[data-journey]').forEach(b=>b.onclick=()=>{
    const i = +b.dataset.journey;
    if (state.journey === i){ // re-click advances one step
      state.step = (state.step + 1) % JOURNEYS[i].steps.length;
    } else { state.journey = i; state.step = 0; }
    state.screen = JOURNEYS[i].steps[state.step][0]; renderStage();
    const panel = document.querySelector('.proto__right');
    if (panel) panel.scrollTop = 0;
  });
  stage.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{
    const dir = b.dataset.step === 'next' ? 1 : -1;
    const j = JOURNEYS[state.journey];
    state.step = Math.max(0, Math.min(j.steps.length-1, state.step + dir));
    state.screen = j.steps[state.step][0];
    renderStage();
  });
  stage.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>{
    const a = b.dataset.action;
    if (a==='apply-theme' || a==='premium'){ applyThemeFlow(); }
    if (a==='back'){ setScreen('home'); }
    if (a==='zoom-in'){ state.zoom = Math.min(1.1, state.zoom + .1); updateDevice(); }
    if (a==='zoom-out'){ state.zoom = Math.max(.55, state.zoom - .1); updateDevice(); }
    if (a==='export-tokens'){ downloadFile('lumaos-tokens.json', JSON.stringify(buildTokens(), null, 2), 'application/json'); }
    if (a==='export-spec'){ downloadFile('lumaos-spec.md', specMarkdown(), 'text/markdown'); }
  });
  stage.querySelectorAll('[data-grid]').forEach(b=>b.onclick=()=>{ state.gridCols=+b.dataset.grid; renderStage(); });
  stage.querySelectorAll('[data-dock]').forEach(b=>b.onclick=()=>{ state.dockSlots=+b.dataset.dock; renderStage(); });
  stage.querySelectorAll('[data-action="rearrange"]').forEach(b=>b.onclick=()=>{
    state.rearrange=!state.rearrange; state.picked=null; renderStage();
  });
  stage.querySelectorAll('[data-action="reset-layout"]').forEach(b=>b.onclick=()=>{
    delete state.order[state.theme]; state.picked=null; renderStage();
  });
  stage.querySelectorAll('[data-bind]').forEach(el=>{
    const ev = el.type==='range' ? 'input' : 'change';
    el.addEventListener(ev, ()=>{
      const k = el.dataset.bind;
      if (k==='tile'){ state.tile = +el.value; const v=document.getElementById('tileVal'); if(v) v.textContent = state.tile+' dp'; }
      if (k==='labels') state.labels = el.checked;
      if (k==='motion'){ state.motion = el.checked?'reduced':'full'; document.documentElement.dataset.motion = state.motion==='reduced'?'reduced':'full'; }
      updateDevice();
    });
  });
  // app launch demo + tile feedback
  stage.querySelectorAll('[data-app]').forEach(el=>{
    el.addEventListener('click', (ev)=>{
      const name = el.dataset.app;
      if (state.rearrange && state.screen==='home'){
        ev.stopPropagation();
        const t = state.theme;
        if (!state.order[t]) state.order[t] = HOME_APPS[t].slice();
        const arr = state.order[t];
        if (!state.picked){ state.picked = name; renderStage(); return; }
        if (state.picked === name){ state.picked = null; renderStage(); return; }
        const a = arr.indexOf(state.picked), b2 = arr.indexOf(name);
        if (a > -1 && b2 > -1){ const tmp = arr[a]; arr[a] = arr[b2]; arr[b2] = tmp; }
        state.picked = null; renderStage(); return;
      }
      const host = document.getElementById('deviceHost');
      if (!host) return;
      const screen = host.querySelector('.device__screen');
      if (!screen) return;
      const old = screen.querySelector('.toast--demo'); if (old) old.remove();
      const div = document.createElement('div');
      div.className = 'toast toast--demo';
      div.innerHTML = `<span class="toast__ic">${glyph('check',12,{sw:3})}</span>
        <span><span class="toast__t">Opening ${name}</span><span class="toast__s" style="display:block">Prototype · app launch is system-owned</span></span>`;
      screen.appendChild(div);
      setTimeout(()=>div.remove(), 1500);
    });
  });
  // motion demos
  stage.querySelectorAll('[data-motion-demo]').forEach(demo=>{
    const ball = demo.querySelector('.motionDemo__ball');
    const kind = demo.dataset.motionDemo;
    const play = ()=>{
      const dist = demo.clientWidth - 62;
      const dur = kind==='reduced' ? 120 : 320;
      ball.style.transition = kind==='reduced' ? 'opacity 120ms linear' : `transform ${dur}ms cubic-bezier(${kind==='emphasis'?'.16,.84,.28,1':'.22,.61,.36,1'})`;
      if (kind==='reduced'){ ball.style.opacity='0'; ball.style.transform='none';
        setTimeout(()=>{ ball.style.transition='opacity 120ms linear'; ball.style.opacity='1'; },140); return; }
      ball.style.transform = `translateX(${dist}px)`;
      setTimeout(()=>{ ball.style.transition='transform 240ms cubic-bezier(.4,0,1,1)'; ball.style.transform='none'; }, dur + 260);
    };
    demo.addEventListener('mouseenter', play);
    demo.addEventListener('click', play);
  });
  // device home tap zones: swipe simulation via buttons in edit bar etc.
  const host = document.getElementById('deviceHost');
  if (host){
    host.querySelectorAll('.pagedots i').forEach(d=>d.onclick=()=>{ state.screen='spaces'; renderStage(); });
  }
}

function renderNavRail(){
  document.getElementById('rail').innerHTML = renderNav();
  document.querySelectorAll('.rail__item').forEach(b=>b.onclick=()=>{
    currentView = b.dataset.view; renderNavRail(); renderStage(); window.scrollTo(0,0);
  });
}

/* ---------- downloads ---------- */
function downloadFile(name, content, mime){
  const blob = new Blob([content], {type:mime});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href), 3000);
}
function buildTokens(){
  const themeTokens = (k) => {
    const el = document.createElement('div'); el.setAttribute('data-theme', k); el.style.position='absolute'; el.style.left='-9999px';
    document.body.appendChild(el);
    const cs = getComputedStyle(el);
    const keys = ['--bg-0','--bg-1','--bg-2','--surface-1','--surface-2','--surface-3','--surface-solid','--stroke-1','--stroke-2',
      '--text-1','--text-2','--text-3','--accent','--accent-2','--accent-soft','--ok','--warn','--danger',
      '--r-xl','--r-lg','--r-md','--r-sm','--r-xs','--tile-r','--tile-size','--blur','--sat','--dock-r','--shadow-2','--shadow-3'];
    const out = {};
    keys.forEach(k2=>out[k2.replace('--','')] = cs.getPropertyValue(k2).trim());
    el.remove();
    return out;
  };
  return {
    name:'LumaOS', version:'3.2', generated:new Date().toISOString(),
    typography:{display:'Luma Display', text:'Luma Text', mono:'Luma Mono',
      scale:{clock:66, screenTitle:21, sectionHeading:14, widgetHeading:12.5, primary:13, appLabel:11, supporting:10.5, numeric:10, button:13.5, kicker:9.5}},
    spacing:{'sp-1':2,'sp-2':4,'sp-3':8,'sp-4':12,'sp-5':16,'sp-6':20,'sp-7':24,'sp-8':32,'sp-9':40,'sp-10':56,'sp-11':72},
    motion:{dur1:120,dur2:200,dur3:320,dur4:480,press:90,longPress:500,
      easing:{standard:'cubic-bezier(.22,.61,.36,1)', emphasis:'cubic-bezier(.16,.84,.28,1)', exit:'cubic-bezier(.4,0,1,1)'}},
    themes:{signature:themeTokens('signature'), atmosphere:themeTokens('atmosphere'), monolith:themeTokens('monolith')},
  };
}
function specMarkdown(){
  const t = buildTokens();
  return `# LumaOS — Design System v3.2

Three themes, one grammar. Generated from the design studio token layer.

## Principles
Precision · Depth · Clarity · Personality · Restraint.

## Typography
| Role | Family | Size / Weight / Tracking |
|---|---|---|
| Clock | Luma Display | 66 / 250 / -0.035em (theme: 64 / 58 / 84) |
| Screen title | Luma Display | 21 / 600 / -0.015em |
| Section heading | Luma Text | 14 / 560 |
| Widget heading | Luma Text | 12.5 / 540 |
| Primary info | Luma Text | 13 / 450 |
| App label | Luma Text | 11 / 480 |
| Supporting | Luma Text | 10.5 / 400 |
| Numeric | Luma Mono | 10 / 500 / +0.12em |
| Button | Luma Text | 13.5 / 600 |
| Kicker | Luma Text | 9.5 / 650 / +0.14em uppercase |

## Themes
${Object.entries(t.themes).map(([k,v])=>`### ${k}
- background: ${v['bg-0']} / ${v['bg-1']} / ${v['bg-2']}
- surfaces: ${v['surface-1']} · ${v['surface-2']} · ${v['surface-3']}
- text: ${v['text-1']} · ${v['text-2']} · ${v['text-3']}
- accent: ${v.accent} / accent-2 ${v['accent-2']}
- radii: ${v['r-xl']} / ${v['r-lg']} / ${v['r-md']} / ${v['r-sm']}
- icon tile: ${v['tile-size']} radius ${v['tile-r']}
- blur / saturation: ${v.blur} / ${v.sat}
`).join('\n')}

## Spacing
2 · 4 · 8 · 12 · 16 · 20 · 24 · 32 · 40 · 56 · 72

## Motion
120 / 200 / 320 / 480 ms; press 90 in, 180 out; long-press 500.
standard cubic-bezier(.22,.61,.36,1) · emphasis cubic-bezier(.16,.84,.28,1) · exit cubic-bezier(.4,0,1,1).

## Accessibility
Minimum 44dp targets; text-1 ≥15:1, text-2 ≥7:1, text-3 ≥4.6:1 against composited wallpaper; adaptive scrim raises wallpaper contrast; reduced-motion alternative for every transition.

## Scope honesty
LumaOS cannot restyle Android system Quick Settings, shade chrome, or third-party notification layouts. Glance is a launcher-owned surface over posted notifications.
`;
}

/* ---------- boot ---------- */
function boot(){
  renderNavRail();
  renderStage();
  document.querySelectorAll('.themeDot').forEach(d=>d.onclick=()=>setTheme(d.dataset.setTheme));
  document.querySelectorAll('[data-top-action]').forEach(b=>b.onclick=()=>{
    const a = b.dataset.topAction;
    if (a==='export') downloadFile('lumaos-tokens.json', JSON.stringify(buildTokens(),null,2),'application/json');
    if (a==='hint'){
      const ex = document.getElementById('shortcuts');
      if (ex){ ex.remove(); return; }
      const d = document.createElement('div'); d.id='shortcuts'; d.className='shortcuts';
      d.innerHTML = `<b>Shortcuts</b>
        <div><span class="mono">1 2 3</span> theme · Signature / Atmosphere / Monolith</div>
        <div><span class="mono">H D S T G</span> home · drawer · shelf · studio · glance</div>
        <div><span class="mono">← →</span> previous / next screen in prototype</div>
        <div><span class="mono">Esc</span> close overlays</div>`;
      b.parentElement.appendChild(d);
      setTimeout(()=>d.remove(), 7000);
    }
    if (a==='motion'){ state.motion = state.motion==='reduced'?'full':'reduced';
      document.documentElement.dataset.motion = state.motion;
      b.setAttribute('aria-pressed', String(state.motion==='reduced')); }
    if (a==='grid'){ state.labels = !state.labels; document.body.classList.toggle('hideLabels', !state.labels);
      b.setAttribute('aria-pressed', String(!state.labels)); document.querySelectorAll('[data-bind="labels"]').forEach(cb=>cb.checked=state.labels);
      updateDevice(); }
  });
  document.addEventListener('keydown', e=>{
    if (e.target.matches('input,select,textarea')) return;
    if (e.key==='1') setTheme('signature');
    if (e.key==='2') setTheme('atmosphere');
    if (e.key==='3') setTheme('monolith');
    if (e.key==='h') setScreen('home');
    if (e.key==='d') setScreen('drawer');
    if (e.key==='s') setScreen('shelf');
    if (e.key==='t') setScreen('studio');
    if (e.key==='g') setScreen('glance');
    if (e.key==='Escape'){ document.querySelectorAll('.shortcuts').forEach(x=>x.remove()); setScreen('home'); }
    if (e.key==='ArrowRight' || e.key==='ArrowLeft'){
      const ids = SCREENS.map(x=>x.id); const i = ids.indexOf(state.screen);
      const n = e.key==='ArrowRight' ? (i+1)%ids.length : (i-1+ids.length)%ids.length;
      setScreen(ids[n]);
    }
  });
  document.documentElement.style.setProperty('--ui-accent', THEMES[state.theme].accent);
}
document.addEventListener('DOMContentLoaded', boot);
</script>
