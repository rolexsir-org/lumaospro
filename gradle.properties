# --- ROLEXM build tuning -------------------------------------------------
# The reference build machine for this project is modest, and the target devices
# are low-memory phones, so the build itself is kept as frugal as the product.
# R8 (minifyReleaseWithR8) needs a large heap of its own. The sandbox has
# 2 GB total, so the Gradle daemon heap is deliberately modest: a large daemon
# heap plus R8 exceeded available memory and got the build OOM-killed. On a
# normal 8 GB+ machine -Xmx2048m is fine.
org.gradle.jvmargs=-Xmx700m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.parallel=false
# The sandbox has 2 cores / 2 GB RAM; a second worker competes for the same
# memory and has been observed to get the Kotlin compiler OOM-killed.
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.daemon=true

# Gradle user home is controlled by the GRADLE_USER_HOME environment variable
# (set by build.sh / CI), not by a gradle.properties entry. The previous
# absolute /home/rolexsir/.gradle path belonged to another machine and is not
# valid in a fresh checkout.

# Kotlin compiles in-process so a single JVM heap is shared with Gradle rather
# than a second Kotlin daemon competing for the same physical memory.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.nonFinalResIds=false

# R8 shrinks the launcher; see app/proguard-rules.pro.
#
# AGP 8.x defaults R8 to full mode; LumaOS Pro adopts it after the November
# 2026 isolated experiment (R8 8.13.6, identical rule set to compatibility
# mode): zero errors, zero missing-class diagnostics, every manifest component
# and lifecycle entry point kept, dex -19.2% / bundle -2.2% against the
# compatibility build. The keep rules in app/proguard-rules.pro remain the
# verified minimum (5 directives / 4 logical rules) - no blanket entries.
# isMinifyEnabled/isShrinkResources in app/build.gradle.kts stay on.
# Release gate for this flag: networked ./build.sh lint test assembleDebug
# bundleRelease, inspect app/build/outputs/mapping/release/ (mapping.txt is
# required for crash deobfuscation and must be uploaded to Play Console →
# Release → Setup → App integrity → Symbol files), device smoke on Android
# 15/16 and pre-15 covering launcher, predictive back, Settings, Control
# Centre, Vault, biometric, accessibility, notifications, media and widgets.
android.enableR8.fullMode=true
