# --- LumaOS Pro build tuning -------------------------------------------------
# The reference build machine for this project is modest, and the target devices
# are low-memory phones, so the build itself is kept as frugal as the product.
# R8 (minifyReleaseWithR8) needs a large heap of its own. The sandbox has
# 2 GB total, so the Gradle daemon heap is deliberately modest: a large daemon
# heap plus R8 exceeded available memory and got the build OOM-killed. On a
# normal 8 GB+ machine -Xmx2048m is fine.
org.gradle.jvmargs=-Xmx700m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.parallel=false
# The sandbox has 2 cores / 2 GB RAM; a second worker competes for the same
# memory and has been observed to get the Kotlin compiler OOM-killed.
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin compiles in-process so a single JVM heap is shared with Gradle rather
# than a second Kotlin daemon competing for the same physical memory.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.nonFinalResIds=false

# R8 shrinks the launcher; see app/proguard-rules.pro.
# fullMode is off: it shrinks harder but needs noticeably more memory than
# this build machine has. The explicit keep rules in app/proguard-rules.pro
# cover what full mode would otherwise infer.
android.enableR8.fullMode=false
