# --- ROLEXM build tuning -------------------------------------------------
# The reference build machine for this project is modest, and the target devices
# are low-memory phones, so the build itself is kept as frugal as the product.
# R8 (minifyReleaseWithR8) needs a large heap of its own. The sandbox has
# 2 GB total, so the Gradle daemon heap is deliberately modest: a large daemon
# heap plus R8 exceeded available memory and got the build OOM-killed. On a
# normal 8 GB+ machine -Xmx2048m is fine.
org.gradle.jvmargs=-Xmx700m -XX:MaxMetaspaceSize=320m -Dfile.encoding=UTF-8
org.gradle.parallel=false
# The sandbox has 2 cores / 2 GB RAM; a second worker competes for the same
# memory and has been observed to get the Kotlin compiler OOM-killed.
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.daemon=true

# Gradle user home is controlled by the GRADLE_USER_HOME environment variable
# (set by build.sh / CI), not by a gradle.properties entry. The previous
# absolute /home/rolexsir/.gradle path belonged to another machine and is not
# valid in a fresh checkout.

# Kotlin compiles in-process so a single JVM heap is shared with Gradle rather
# than a second Kotlin daemon competing for the same physical memory.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true
kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true
android.enableJetifier=false
android.nonFinalResIds=false

# R8 shrinks the launcher; see app/proguard-rules.pro.
#
# AGP 8.x defaults R8 to full mode (android.enableR8.fullMode=true). LumaOS Pro
# deliberately keeps full mode OFF:
#   * full mode needs a noticeably larger R8 heap than this reference build
#     machine has (the daemon is capped in this file precisely because a large
#     daemon heap plus R8 OOM-killed the build);
#   * full mode tightens the contract around keep rules (weaker default
#     inference for horizontal/vertical class merging and for library code),
#     so flipping it must ship together with a verified release cycle -
#     minified bundle, smoke-tested Vault/launcher flows, and an inspected
#     mapping file - never as an untested change.
# isMinifyEnabled/isShrinkResources in app/build.gradle.kts stay on either
# way; the keep rules in app/proguard-rules.pro were trimmed to the verified
# minimum during the November 2026 compatibility audit.
android.enableR8.fullMode=false
